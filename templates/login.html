
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Singh Transport - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#eab308">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Singh Transport">
    <link rel="apple-touch-icon" href="/static/Singh_logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #050d1a 0%, #0a1628 40%, #0f2044 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; position: relative;
        }

        /* Animated grid */
        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(234,179,8,0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(234,179,8,0.07) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
            pointer-events: none; z-index: 0;
        }
        @keyframes grid-move { 0% { background-position: 0 0; } 100% { background-position: 50px 50px; } }

        /* Floating particles */
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; border-radius: 50%; animation: float-up linear infinite; opacity: 0; }
        @keyframes float-up {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 0.2; }
            90%  { opacity: 0.2; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* Card */
        .login-wrapper {
            position: relative; z-index: 10;
            width: 100%; max-width: 440px; padding: 20px;
            animation: card-enter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes card-enter {
            from { opacity: 0; transform: translateY(60px) scale(0.9); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(234,179,8,0.3);
            border-radius: 24px; padding: 40px 36px; position: relative;
            box-shadow: 0 0 0 1px rgba(234,179,8,0.1), 0 25px 50px rgba(0,0,0,0.5), 0 0 80px rgba(59,130,246,0.08);
            overflow: hidden;
        }
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 80px; height: 80px;
            border-top: 2px solid rgba(234,179,8,0.7); border-left: 2px solid rgba(234,179,8,0.7);
            border-radius: 24px 0 0 0;
        }
        .login-card::after {
            content: ''; position: absolute; bottom: 0; right: 0;
            width: 80px; height: 80px;
            border-bottom: 2px solid #3b82f6; border-right: 2px solid #3b82f6;
            border-radius: 0 0 24px 0;
        }

        /* Logo */
        .logo-section { text-align: center; margin-bottom: 28px; }
        .logo-ring {
            display: inline-block; padding: 5px; border-radius: 50%;
            background: linear-gradient(135deg, #1d4ed8, #2563eb, #eab308, #fde047);
            background-size: 300% 300%;
            animation: ring-glow 3s ease infinite;
            box-shadow: 0 0 30px rgba(234,179,8,0.5);
        }
        @keyframes ring-glow {
            0%   { background-position: 0% 50%;   box-shadow: 0 0 20px rgba(234,179,8,0.5); }
            50%  { background-position: 100% 50%; box-shadow: 0 0 45px rgba(234,179,8,0.9), 0 0 70px rgba(234,179,8,0.3); }
            100% { background-position: 0% 50%;   box-shadow: 0 0 20px rgba(234,179,8,0.5); }
        }
        .logo-img {
            width: 110px; height: 110px; border-radius: 50%;
            object-fit: contain; background: #fff; display: block;
            animation: logo-float 3s ease-in-out infinite;
        }
        @keyframes logo-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

        .brand-title {
            margin-top: 14px; font-size: 1.45rem; font-weight: 700;
            background: linear-gradient(90deg, #2563eb, #3b82f6, #eab308);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            letter-spacing: 1px;
        }
        .brand-subtitle { color: rgba(255,255,255,0.45); font-size: 0.75rem; letter-spacing: 4px; text-transform: uppercase; margin-top: 5px; }

        .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(234,179,8,0.8), transparent); margin: 22px 0; }

        /* Form */
        .form-label-custom { color: rgba(255,255,255,0.65); font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 7px; display: block; }
        .input-wrap { position: relative; margin-bottom: 20px; }
        .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(234,179,8,0.8); font-size: 0.9rem; z-index: 2; transition: color 0.3s; }
        .input-field {
            width: 100%; padding: 12px 14px 12px 42px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(234,179,8,0.2);
            border-radius: 10px; color: #fff; font-size: 0.95rem; transition: all 0.3s; outline: none;
        }
        .input-field::placeholder { color: rgba(255,255,255,0.25); }
        .input-field:focus {
            border-color: #3b82f6; background: rgba(255,255,255,0.09);
            box-shadow: 0 0 0 3px rgba(234,179,8,0.2), 0 0 20px rgba(234,179,8,0.1);
        }
        .input-wrap:focus-within .input-icon { color: #3b82f6; }

        /* Button */
        .btn-login {
            width: 100%; padding: 13px; border: none; border-radius: 10px; color: #fff;
            background: linear-gradient(135deg, #1e3a8a, #2563eb, #eab308);
            background-size: 200% 200%; font-size: 1rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
            transition: all 0.3s ease; margin-top: 6px;
            animation: btn-pulse 2.5s ease infinite;
            box-shadow: 0 4px 20px rgba(234,179,8,0.4);
        }
        @keyframes btn-pulse { 0%, 100% { box-shadow: 0 4px 20px rgba(234,179,8,0.4); } 50% { box-shadow: 0 4px 35px rgba(59,130,246,0.7); } }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 35px rgba(59,130,246,0.7); }
        .btn-login:active { transform: translateY(0); }

        /* Alert */
        .alert-error {
            background: rgba(220,38,38,0.12); border: 1px solid rgba(220,38,38,0.35);
            color: #fca5a5; border-radius: 10px; padding: 10px 14px; font-size: 0.88rem;
            margin-bottom: 16px; animation: shake 0.4s ease;
        }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    </style>
</head>
<body>
<div class="grid-bg"></div>
<div class="particles" id="particles"></div>

<div class="login-wrapper">
    <div class="login-card">
        <!-- Logo -->
        <div class="logo-section">
            <div class="logo-ring">
                <img src="{{ url_for('static', filename='Singh_logo.png') }}" alt="Singh Transport Logo" class="logo-img">
            </div>
            <div class="brand-title">Singh Transport</div>
            <div class="brand-subtitle">Rate Card System</div>
        </div>

        <div class="divider"></div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert-error"><i class="fas fa-exclamation-triangle me-2"></i>{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Form -->
        <form method="POST">
            <label class="form-label-custom">Username</label>
            <div class="input-wrap">
                <input type="text" name="username" class="input-field" placeholder="Enter your username" required autocomplete="off">
                <i class="fas fa-user input-icon"></i>
            </div>

            <label class="form-label-custom">Password</label>
            <div class="input-wrap">
                <input type="password" name="password" class="input-field" placeholder="Enter your password" required>
                <i class="fas fa-lock input-icon"></i>
            </div>

            <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt me-2"></i>Login</button>
        </form>
    </div>
</div>

<script>
    const container = document.getElementById('particles');
    const colors = ['#2563eb','#3b82f6','#eab308','rgba(255,255,255,0.8)'];
    for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 7 + 2;
        p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${Math.random()*18+8}s;animation-delay:${Math.random()*12}s;`;
        container.appendChild(p);
    }
</script>
</body>
</html>
