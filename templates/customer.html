<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer - Rate Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .search-section { display: none; }
        .search-section.active { display: block; }
        #weightResult {
            min-height: 60px;
            font-size: 1.1rem;
            font-weight: 500;
        }
        /* Autocomplete styles */
        .autocomplete-wrapper { position: relative; }
        .autocomplete-list {
            position: absolute;
            z-index: 1000;
            background: #fff;
            border: 1px solid #ced4da;
            border-top: none;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .autocomplete-list div {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .autocomplete-list div:hover,
        .autocomplete-list div.active {
            background-color: #198754;
            color: #fff;
        }
    </style>
</head>
<body class="bg-light">

<!-- Pass data from Flask to JS -->
<script>
    const ALL_ORIGINS = {{ origin_stations | tojson }};
    const ALL_TRAINS  = {{ train_numbers | tojson }};
</script>

<div class="container mt-4">
    <h2 class="text-center mb-4">Welcome, Customer</h2>
    <div class="card">
        <div class="card-header">Find Rate / Calculate Weight</div>
        <div class="card-body">

            <form method="POST" id="rateForm">
                <!-- Choose search method -->
                <div class="mb-4">
                    <label class="form-label fw-bold">Search / Calculate By:</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="search_type" id="byRoute" value="route"
                               {% if search_type != 'train' and search_type != 'weight' %}checked{% endif %}>
                        <label class="form-check-label" for="byRoute">Station Route</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="search_type" id="byTrain" value="train"
                               {% if search_type == 'train' %}checked{% endif %}>
                        <label class="form-check-label" for="byTrain">Train Number</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="search_type" id="byWeight" value="weight"
                               {% if search_type == 'weight' %}checked{% endif %}>
                        <label class="form-check-label" for="byWeight">Weight Calculated</label>
                    </div>
                </div>

                <!-- Station Route section -->
                <div id="routeSection" class="search-section row g-3
                     {% if search_type == 'train' or search_type == 'weight' %}d-none{% else %}active{% endif %}">

                    <!-- FROM STATION with autocomplete -->
                    <div class="col-md-6">
                        <label class="form-label">From Station</label>
                        <div class="autocomplete-wrapper">
                            <input type="text" id="fromStationInput" name="from_station"
                                   class="form-control" placeholder="Type to search station..."
                                   autocomplete="off"
                                   value="{{ request.form.from_station or '' }}">
                            <div class="autocomplete-list d-none" id="fromDropdown"></div>
                        </div>
                    </div>

                    <!-- TO STATION filtered dropdown -->
                    <div class="col-md-6">
                        <label class="form-label">To Station</label>
                        <select id="toStationSelect" name="to_station" class="form-select">
                            <option value="">-- Select From Station first --</option>
                        </select>
                    </div>
                </div>

                <!-- Train Number section -->
                <div id="trainSection" class="search-section
                     {% if search_type == 'train' %}active{% else %}d-none{% endif %}">
                    <div class="mb-3">
                        <label class="form-label">Train Number</label>
                        <div class="autocomplete-wrapper">
                            <input type="text" id="trainInput" name="train_number"
                                   class="form-control" placeholder="Type to search train number..."
                                   autocomplete="off"
                                   value="{{ request.form.train_number or '' }}">
                            <div class="autocomplete-list d-none" id="trainDropdown"></div>
                        </div>
                    </div>
                </div>

                <!-- Weight Calculated section -->
                <div id="weightSection" class="search-section
                     {% if search_type == 'weight' %}active{% else %}d-none{% endif %}">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Length (cm)</label>
                            <input type="number" id="length" class="form-control" placeholder="e.g. 60" min="0" step="0.1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Height (cm)</label>
                            <input type="number" id="height" class="form-control" placeholder="e.g. 40" min="0" step="0.1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Width (cm)</label>
                            <input type="number" id="width" class="form-control" placeholder="e.g. 30" min="0" step="0.1">
                        </div>
                    </div>
                    <div class="mt-4">
                        <div class="alert alert-secondary" id="weightResult">
                            Volumetric weight will appear here...
                        </div>
                    </div>
                </div>

                <!-- Submit button only for route/train searches -->
                <div id="submitButtonDiv" {% if search_type == 'weight' %}class="d-none"{% endif %}>
                    <button type="submit" class="btn btn-success mt-3">Search Rate</button>
                </div>
            </form>

            {% if result %}
            <div class="alert alert-info mt-4">
                <strong>Rate Card:</strong> {{ result }}
            </div>
            {% endif %}

            {% if error %}
            <div class="alert alert-warning mt-4">
                {{ error }}
            </div>
            {% endif %}

        </div>
    </div>

    <div class="text-center mt-4">
        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger">Logout</a>
    </div>
</div>

<script>
(function () {
    // ── Elements ──────────────────────────────────────────────
    const routeSection    = document.getElementById('routeSection');
    const trainSection    = document.getElementById('trainSection');
    const weightSection   = document.getElementById('weightSection');
    const submitButtonDiv = document.getElementById('submitButtonDiv');
    const radios          = document.querySelectorAll('input[name="search_type"]');

    const lengthInput = document.getElementById('length');
    const heightInput = document.getElementById('height');
    const widthInput  = document.getElementById('width');
    const resultDiv   = document.getElementById('weightResult');

    // Station route elements
    const fromInput    = document.getElementById('fromStationInput');
    const fromDropdown = document.getElementById('fromDropdown');
    const toSelect     = document.getElementById('toStationSelect');

    // Train number elements
    const trainInput    = document.getElementById('trainInput');
    const trainDropdown = document.getElementById('trainDropdown');

    // Pre-selected values after form submit (restore state)
    const preFrom  = "{{ request.form.from_station or '' }}".trim().toUpperCase();
    const preTo    = "{{ request.form.to_station or '' }}".trim().toUpperCase();
    const preTrain = "{{ request.form.train_number or '' }}".trim();

    // ── Generic autocomplete builder ─────────────────────────
    function buildAutocomplete(input, dropdown, dataList, onSelect) {
        input.addEventListener('input', () => {
            const query = input.value.trim();
            dropdown.innerHTML = '';

            if (!query) { dropdown.classList.add('d-none'); return; }

            const matches = dataList.filter(s =>
                s.toString().toUpperCase().includes(query.toUpperCase())
            );

            if (matches.length === 0) { dropdown.classList.add('d-none'); return; }

            matches.forEach(item => {
                const div = document.createElement('div');
                div.textContent = item;
                div.addEventListener('mousedown', () => {
                    input.value = item;
                    dropdown.classList.add('d-none');
                    if (onSelect) onSelect(item);
                });
                dropdown.appendChild(div);
            });

            dropdown.classList.remove('d-none');
        });

        input.addEventListener('blur', () => {
            setTimeout(() => dropdown.classList.add('d-none'), 150);
        });

        input.addEventListener('keydown', (e) => {
            const items = dropdown.querySelectorAll('div');
            const active = dropdown.querySelector('div.active');
            let idx = Array.from(items).indexOf(active);

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (active) active.classList.remove('active');
                items[(idx + 1) % items.length]?.classList.add('active');
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (active) active.classList.remove('active');
                items[(idx - 1 + items.length) % items.length]?.classList.add('active');
            } else if (e.key === 'Enter') {
                if (active) {
                    e.preventDefault();
                    input.value = active.textContent;
                    dropdown.classList.add('d-none');
                    if (onSelect) onSelect(active.textContent);
                }
            }
        });
    }

    // ── Load To Station destinations via API ──────────────────
    function loadDestinations(origin, selectValue = '') {
        toSelect.innerHTML = '<option value="">Loading...</option>';

        fetch(`/api/destinations?origin=${encodeURIComponent(origin.toUpperCase())}`)
            .then(r => r.json())
            .then(destinations => {
                toSelect.innerHTML = '<option value="">-- Select Destination --</option>';
                if (destinations.length === 0) {
                    toSelect.innerHTML = '<option value="">No destinations found</option>';
                    return;
                }
                destinations.forEach(dest => {
                    const opt = document.createElement('option');
                    opt.value = dest;
                    opt.textContent = dest;
                    if (dest === selectValue) opt.selected = true;
                    toSelect.appendChild(opt);
                });
            })
            .catch(() => {
                toSelect.innerHTML = '<option value="">Error loading destinations</option>';
            });
    }

    // ── Setup autocompletes ───────────────────────────────────

    // From Station autocomplete → triggers To Station load
    buildAutocomplete(fromInput, fromDropdown, ALL_ORIGINS, (selected) => {
        loadDestinations(selected);
    });

    // Also trigger on manual typed change + blur
    fromInput.addEventListener('change', () => {
        const val = fromInput.value.trim().toUpperCase();
        if (ALL_ORIGINS.includes(val)) loadDestinations(val);
    });

    // Train Number autocomplete (no callback needed)
    buildAutocomplete(trainInput, trainDropdown, ALL_TRAINS, null);

    // ── Toggle between search sections ───────────────────────
    function toggleSections() {
        const isRoute  = document.getElementById('byRoute').checked;
        const isTrain  = document.getElementById('byTrain').checked;

        if (isRoute) {
            routeSection.classList.remove('d-none');
            routeSection.classList.add('active');
            trainSection.classList.add('d-none');
            weightSection.classList.add('d-none');
            submitButtonDiv.classList.remove('d-none');
            trainInput.value = '';
            lengthInput.value = heightInput.value = widthInput.value = '';
            resultDiv.innerHTML = 'Volumetric weight will appear here...';

        } else if (isTrain) {
            trainSection.classList.remove('d-none');
            trainSection.classList.add('active');
            routeSection.classList.add('d-none');
            weightSection.classList.add('d-none');
            submitButtonDiv.classList.remove('d-none');
            fromInput.value = '';
            toSelect.innerHTML = '<option value="">-- Select From Station first --</option>';
            lengthInput.value = heightInput.value = widthInput.value = '';
            resultDiv.innerHTML = 'Volumetric weight will appear here...';

        } else {
            weightSection.classList.remove('d-none');
            weightSection.classList.add('active');
            routeSection.classList.add('d-none');
            trainSection.classList.add('d-none');
            submitButtonDiv.classList.add('d-none');
            fromInput.value = '';
            toSelect.innerHTML = '<option value="">-- Select From Station first --</option>';
            trainInput.value = '';
            calculateWeight();
        }
    }

    // ── Volumetric weight calculator ─────────────────────────
    function calculateWeight() {
        const l = parseFloat(lengthInput.value) || 0;
        const h = parseFloat(heightInput.value) || 0;
        const w = parseFloat(widthInput.value)  || 0;

        if (l === 0 || h === 0 || w === 0) {
            resultDiv.innerHTML = 'Volumetric weight will appear here...';
            resultDiv.className = 'alert alert-secondary';
            return;
        }

        const volume = l * h * w;
        const weight = volume / 5000;
        const rounded = Math.round(weight * 100) / 100;

        resultDiv.innerHTML = `<strong>Volumetric weight:</strong> ${rounded} kg`;
        resultDiv.className = 'alert alert-primary';
    }

    // ── Restore state after form submit ──────────────────────
    if (preFrom) loadDestinations(preFrom, preTo);

    // ── Event listeners ───────────────────────────────────────
    radios.forEach(radio => radio.addEventListener('change', toggleSections));
    [lengthInput, heightInput, widthInput].forEach(input => input.addEventListener('input', calculateWeight));

    // Initial setup
    toggleSections();

})();
</script>
</body>
</html>
